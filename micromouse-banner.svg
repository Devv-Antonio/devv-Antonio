<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .border { fill: none; stroke: #30363d; stroke-width: 2; }
      .wall { stroke: #21262d; stroke-width: 6; fill: none; stroke-linecap: round; }
      .trail { stroke: #39d353; stroke-width: 2; stroke-dasharray: 3 7; fill: none; opacity: 0.55; }
      .title { font-family: 'Courier New', monospace; fill: #c9d1d9; font-size: 24px; font-weight: bold; }
      .subtitle { font-family: 'Courier New', monospace; fill: #8b949e; font-size: 13px; }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.25); }
      }
      .goal { transform-origin: 810px 70px; animation: pulse 1.3s ease-in-out infinite; }
    </style>
  </defs>

  <rect class="bg" width="900" height="200" rx="14"/>
  <rect class="border" x="1" y="1" width="898" height="198" rx="14"/>

  <!-- paredes decorativas do labirinto -->
  <path class="wall" d="M60,60 H180 M60,60 V130 M180,60 V20 M300,130 V60 H420 M420,60 V150
                          M540,150 H620 M620,150 V80 M620,80 H760 M760,80 V30" />

  <!-- trilha do robô -->
  <path id="mousePath" class="trail" d="M60,100 L200,100 L200,50 L400,50 L400,150 L600,150 L600,80 L800,80" />

  <!-- objetivo -->
  <text class="goal" x="795" y="80" font-size="26">🧀</text>

  <!-- micromouse -->
  <g>
    <circle r="9" fill="#58a6ff"/>
    <circle cx="6" cy="-3" r="1.6" fill="#0d1117"/>
    <path d="M -9 0 L -16 -4 L -16 4 Z" fill="#58a6ff"/>
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#mousePath"/>
    </animateMotion>
  </g>

  <text class="title" x="40" y="35">&gt; Antônio Lucas<tspan class="cursor">_</tspan></text>
  <text class="subtitle" x="40" y="180">construindo coisas que se movem — software, robôs e tudo entre eles</text>
</svg>
